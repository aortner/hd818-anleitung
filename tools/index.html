<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HD818 Anleitungen</title>
<style>
  :root { --text:#1d2329; --line:#d9dee3; --bg:#ffffff; --accent:#2e7d32; --card:#f6f8f6; }
  @media (prefers-color-scheme: dark) { :root { --text:#e4e8eb; --line:#38424a; --bg:#161b1f; --accent:#7cc47f; --card:#1e2a20; } }
  html, body { background: var(--bg); color: var(--text); }
  body { font: 16px/1.5 system-ui, "Segoe UI", Roboto, sans-serif; max-width: 820px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 1.8em; margin: 0 0 .2em; }
  p.sub { margin: 0 0 2em; opacity: .8; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 20px; }
  .card h2 { margin: 0 0 .3em; font-size: 1.25em; }
  .card p { margin: 0 0 1em; }
  .card a { display: inline-block; margin-right: 1em; color: var(--accent); font-weight: 600; text-decoration: none; }
  .card a:hover { text-decoration: underline; }
</style>
</head>
<body>
<h1>HD812/818 Automatisches Lenksystem</h1>
<p class="sub">Anleitungen · Manuals</p>
<div class="grid">
  <div class="card">
    <h2>Benutzeranleitung · User manual</h2>
    <p>Bedienung der Software Vectoris Pro · Operating the Vectoris Pro software</p>
    <a href="de/">Deutsch</a><a href="en/">English</a>
  </div>
  <div class="card">
    <h2>Montageanleitung · Installation manual</h2>
    <p>Einbau in den Traktor · Installing the system in the tractor</p>
    <a href="hardware/de/">Deutsch</a><a href="hardware/en/">English</a>
  </div>
</div>
</body>
</html>
